<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>二维思维导图</title>
  <link rel="stylesheet" href="mindmap.css">
  <script defer src="model.js"></script>
  <script defer src="mindmap.js"></script>
</head>
<body>
  <div id="toolbar" role="toolbar" aria-label="导图画布工具">
    <button id="zoom-in" title="放大画布">放大 +</button>
    <button id="zoom-out" title="缩小画布">缩小 −</button>
    <button id="fit">适应画布</button>
    <button id="reset">复位布局</button>
    <button id="expand">展开全部</button>
    <button id="save">保存布局</button>
    <span id="status" role="status" aria-live="polite">等待本地知识数据…</span>
  </div>
  <svg id="canvas" tabindex="0" role="group" aria-label="二维思维导图画布：拖动节点调整位置，空白处拖动平移，滚轮缩放">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs>
    <g id="viewport"><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <p id="counts"></p>
  <p id="hint">拖动只改变位置；点击节点在画布下方查看内容与来源。文档上的 − / + 仅折叠或展开所属来源页；其他关联保持原有方向与含义。</p>
</body>
</html>
